name: Secret scan
description: gitleaks, pinned by version and sha256, over the tree at `root`, with no config file, config variable or allow comment able to turn a rule off.

# ADR-092 dec. 4–5. A false positive leaves at the source; a `.gitleaksignore` only as a last resort,
# justified in the PR that creates it.
inputs:
  root:
    description: Root of the tree to scan
    default: .

runs:
  using: composite
  steps:
    # gitleaks reads `<target>/.gitleaks.toml` as its config: a planted one could turn rules off.
    - name: no gitleaks config in the tree
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        if [ -e .gitleaks.toml ]; then
          echo "::error::.gitleaks.toml found in the tree; the scan runs with the built-in rules only"
          exit 1
        fi
    # The checksums are those of the v8.30.1 release's checksums.txt.
    - name: install gitleaks 8.30.1 (sha256 pinned)
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          macOS/ARM64) asset=darwin_arm64; sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
          Linux/X64) asset=linux_x64; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
          *) echo "::error::no pinned gitleaks build for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/gitleaks-8.30.1"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" \
          "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${asset}.tar.gz"
        if command -v sha256sum >/dev/null 2>&1; then got=$(sha256sum "$dir/gitleaks.tar.gz" | cut -d' ' -f1)
        else got=$(shasum -a 256 "$dir/gitleaks.tar.gz" | cut -d' ' -f1); fi
        if [ "$got" != "$sum" ]; then
          echo "::error::gitleaks archive sha256 mismatch: got $got"
          exit 1
        fi
        tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
        "$dir/gitleaks" version
    # Relative path on purpose: in `dir` mode the fingerprint carries the scan path as given.
    # --ignore-gitleaks-allow: an inline `gitleaks:allow` comment cannot skip a finding.
    - name: gitleaks dir
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
        "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" dir . --ignore-gitleaks-allow --redact --no-banner
